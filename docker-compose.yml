services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not published to the host: only services on the compose network need to
    # reach Postgres. Add a `ports:` mapping here if direct host access (e.g.
    # a local psql/GUI client) is ever needed.

  redis:
    image: redis:7.4-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not published to the host, for the same reason as postgres above.

  backend:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # STORY-052: points at /health/ready (dependency-aware), not the
      # liveness-only /health -- container orchestration wants to know
      # "can this serve real traffic," which is readiness's exact
      # definition. Explicit try/except (not relying on an uncaught
      # HTTPError's own exit-1 side effect, which /health's old
      # unconditional-200 response never exercised) -- urlopen() raises
      # HTTPError for the 503 a real dependency outage returns, verified
      # live before relying on this.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys\ntry:\n  sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status == 200 else 1)\nexcept Exception:\n  sys.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  scheduler:
    # STORY-021: reuses the backend image/context (no duplicated
    # application source, no second Dockerfile) with a different command --
    # a long-running loop instead of the HTTP server. `restart:
    # unless-stopped` is new to this file -- justified specifically
    # because this is a background loop process, unlike the request/
    # response services above, which Docker's own healthcheck+depends_on
    # already manage access to.
    # STORY-051: published (unlike Postgres/Redis) so a human can `curl`
    # the scheduler's own /metrics directly during local dev -- it's not
    # the backend's own /metrics (a separate OS process, separate
    # prometheus_client registry); a judgment call, easy to unpublish if
    # you'd prefer network-only access like Postgres/Redis.
    build:
      context: ./backend
    command: ["python", "-m", "app.ingestion.scheduler"]
    env_file: .env
    ports:
      - "${SCHEDULER_METRICS_PORT}:9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
