name: CI

# STORY-053: verification only -- deployment automation is a separate, later
# Story (STORY-056), per this Story's own literal technical note. Three
# independent jobs run in parallel (no `needs:` between them) so a failure in
# one is immediately, separately diagnosable from the others.
#
# Backend/frontend lint and backend static type-checking are NOT run here --
# neither is configured anywhere in this repository (no ruff/mypy/flake8, no
# ESLint config). Inventing new lint tooling as part of this Story was
# explicitly out of scope (see progress.md's STORY-053 Decision entry).
# `npm run build` already performs real TypeScript type-checking (Next.js's
# own build step), so that gap is frontend-lint only, not frontend-type-check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Versions match docker-compose.yml exactly, for parity with local dev.
      # Credentials are fake, CI-only values -- never real, never secrets.
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL/REDIS_URL are left at their unreachable-in-CI defaults
      # (hostnames "postgres"/"redis") on purpose -- the fast suite never
      # touches them (already proven: 413 tests pass with zero Postgres/Redis
      # reachable at all). Only the isolated TEST_* URLs matter here, since
      # GitHub Actions service containers are reachable via localhost when the
      # job itself isn't containerized (conftest.py's own fixtures already
      # read these exact setting names).
      TEST_DATABASE_URL: postgresql+psycopg2://ci_test_user:ci_test_password@localhost:5432/job_platform_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # DATABASE_URL deliberately left at Settings' own unreachable-in-CI
      # default here (hostname "postgres") -- conftest.py's own safety guard
      # refuses to run if TEST_DATABASE_URL and DATABASE_URL are ever equal,
      # so this must stay genuinely distinct from TEST_DATABASE_URL above.
      # The `alembic check` step below overrides DATABASE_URL just for
      # itself, after the test job_platform_test database already exists.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite (fast + integration)
        run: pytest

      - name: Validate Alembic migrations are in sync with the models
        # Targets the job_platform_test database the integration tests above
        # already created and migrated to head -- a step-scoped override, not
        # the job-level DATABASE_URL (see the comment on it above).
        env:
          DATABASE_URL: postgresql+psycopg2://ci_test_user:ci_test_password@localhost:5432/job_platform_test
        run: alembic check

      - name: Dependency vulnerability scan
        run: pip-audit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # A placeholder, non-functional URL -- next build never calls it, it
      # only needs to be a syntactically valid URL (frontend/lib/config.ts's
      # own STORY-013 validation). Matches .env.example's own documented
      # default.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Run frontend test suite
        run: npm test

      - name: Production build (includes real TypeScript type-check)
        run: npm run build

      - name: Dependency vulnerability scan
        run: npm audit

  docker-validate:
    name: docker-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a placeholder .env for syntax validation only
        run: cp .env.example .env

      - name: Validate docker-compose.yml syntax and variable references
        run: docker compose config --quiet
